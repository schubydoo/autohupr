name: Trivy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '31 5 * * 1'

permissions:
  contents: read

jobs:
  scan:
    name: Trivy filesystem scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,misconfig,secret
          format: sarif
          output: trivy-results.sarif
          ignore-unfixed: true
          exit-code: '0'
      - name: Upload results
        # Skip SARIF upload for fork PRs (no security-events write token).
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs

  # The filesystem scan only reads the lockfile. It cannot see Alpine, nodejs,
  # curl or OpenSSL, because those are resolved by `apk add` at image build
  # time -- so OS-package CVEs were invisible to CI. Build the image and scan
  # that instead.
  image:
    name: Trivy image scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      # amd64 only: every arch installs the same apk packages, so one build is
      # enough to surface OS-package CVEs, and three would triple the runtime.
      - name: Build image for scanning
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile.template
          platforms: linux/amd64
          push: false
          load: true
          tags: autohupr:scan
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: autohupr:scan
          scanners: vuln
          format: sarif
          output: trivy-image.sarif
          ignore-unfixed: true
          exit-code: '0'
      - name: Upload results
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

  # A clean master says nothing about what devices actually run: the published
  # image is frozen at the last release and rots as CVEs land upstream. Scan
  # the released artifact weekly and fail loudly, so a stale release arrives as
  # a notification instead of going unnoticed.
  published:
    name: Trivy published image scan
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/${{ github.repository }}:latest
          scanners: vuln
          format: sarif
          output: trivy-published.sarif
          ignore-unfixed: true
          exit-code: '0'
      - name: Upload results
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: trivy-published.sarif
          category: trivy-published
      # ignore-unfixed keeps this quiet unless an upgrade actually exists --
      # i.e. it only fails when cutting a release would genuinely fix something.
      - name: Fail if the released image has fixable HIGH/CRITICAL CVEs
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/${{ github.repository }}:latest
          scanners: vuln
          format: table
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: '1'
