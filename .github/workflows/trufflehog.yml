name: TruffleHog

# PR + weekly full-history sweep. (Push is intentionally omitted: the action
# errors when a push's base == head, e.g. single-commit pushes; PR + scheduled
# full scans cover the same ground without that flake.)
on:
  pull_request:
    branches: [master]
  schedule:
    - cron: '35 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: TruffleHog secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history so scheduled runs scan all commits
      - uses: trufflesecurity/trufflehog@a5f3de55cc2065ae4dde8fee24076f137fd62fcf # v3.97.8
        with:
          extra_args: --only-verified
